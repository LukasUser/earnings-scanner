<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="earnings-scanner: the day's earnings calendar, researched and briefed by Claude, in your inbox every weekday morning">
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: 2.4px; fill: #898781; }
  .title { font-size: 66px; font-weight: 700; letter-spacing: -1.5px; fill: #f0efec; }
  .tag { font-size: 22px; fill: #c3c2b7; }
  .chip { font-size: 14px; font-weight: 500; fill: #c3c2b7; }
  .tape { font-size: 15px; font-weight: 500; fill: #c3c2b7; font-variant-numeric: tabular-nums; }
  .c { opacity: 0; animation: rise .5s ease-out forwards; }
  .scroll { animation: scroll 84s linear infinite; }
  .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes scroll { to { transform: translateX(-3199px); } }
  @keyframes pulse { 0%, 100% { opacity: .9; transform: scale(1); } 50% { opacity: .25; transform: scale(2.2); } }
  @media (prefers-reduced-motion: reduce) { .c { animation: none; opacity: 1; } .scroll, .pulse { animation: none; } }
</style>
